# Met en ligne l'appli Soul Leveling (dossier forge-app) sur GitHub Pages.
# Prérequis unique : Settings > Pages > Source = « GitHub Actions ».
name: Soul Leveling — mise en ligne

on:
  push:
    branches: [main]
    paths: ["forge-app/**", ".github/workflows/soul-leveling-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: soul-leveling-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Préparer le site
        run: |
          mkdir -p _site
          cp -r forge-app/. _site/
          rm -rf _site/supabase _site/artifact.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
